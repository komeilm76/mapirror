# nginx for the web image (tasks `P1-DOCK-02`, `P1-DOCK-03`).
#
# This one file is the whole server: the image copies it to `/etc/nginx/nginx.conf`, and nothing arrives from the base
# image's own `conf.d/default.conf` that anybody has to know about. What it has to do, and why each part is here:
#
# | Job | Where | The failure it prevents |
# |---|---|---|
# | serve the SPA, including deep links | `location ^~ /_site/` | a reload on `/_site/admin/cache` is a `404` from the file system |
# | keep pages and APIs apart | the five `location`s above the page rules | `/_auth/api/*` swallowed by the SPA fallback — the API answers `404` from Vue |
# | proxy the API | `proxy_pass http://api:3000` | requests that work in `bun run dev` and `404` in production |
# | stream uploads and downloads | `proxy_request_buffering off`, `proxy_buffering off`, long timeouts | a multi-gigabyte import spooled to nginx's disk first, and a download cut at `proxy_read_timeout` |
# | cache the bundle, never the shell | `expires 1y` on `/assets/`, `expires -1` on `index.html` | a deploy nobody sees because the browser kept last month's `index.html` |
# | keep the security headers | the six `add_header`s on `index.html` | the SPA is a document, and `14-security.md` §6 is about documents too — the API cannot set headers on a file nginx serves |
#
# ## Why every path here is under `/tmp` or a stream
#
# The container runs as uid `101`, and the directories nginx uses by default belong to root in the official image —
# `/var/run` for the pid, `/var/cache/nginx` for request bodies and proxy buffers, `/var/log/nginx` for the logs. A
# non-root nginx with the stock defaults dies at startup — measured on nginx 1.29.0: `mkdir()
# "/var/cache/nginx/client_temp" failed (13: Permission denied)` (pass 39). So the pid goes to `/tmp`, the temp paths go to
# `/tmp`, and the logs go to the process's own streams — where a container's logs are collected from anyway.
#
# ## Why the proxy directives live at `http` level
#
# `proxy_set_header`, `proxy_read_timeout`, `proxy_buffering` and their neighbours are **inherited** by every location that
# does not set them, so they are written once here and swallowed by the five API locations below; the page locations,
# which do not proxy anything, ignore them. Five copies of eleven lines is five places for one of them to be missing.
#
# ## What is *not* here on purpose
#
# `error_page` for a `502`: when the API is down, nginx answers with its own `502`, and the SPA's client reads it as an
# `UNKNOWN` error. Minting the API's error envelope here would be a development tool pretending to be the API — the same
# decision `dev-proxy.ts` records for its `502` (pass 37). `Strict-Transport-Security` is the TLS proxy's: this process
# speaks plain HTTP on a private port, and its headers are not what a browser sees (D-15).

worker_processes auto;
pid /tmp/nginx.pid;

# `stderr` is nginx's own token for file descriptor 2 — no path is opened, so this works even where `/dev/stderr` cannot be
# (an fd opened through `/proc/self/fd/2` is refused with `EACCES` when the process did not create the pipe; measured on
# nginx 1.29.0, pass 39). `warn` and above, because a per-request line is what `access_log` is for.
error_log stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;

  # Unbuffered by default, nginx writes request bodies and proxy buffers to paths it cannot create as uid 101.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;
  tcp_nopush on;

  # The version goes in the `Server` header and in every error page by default. It tells a stranger which nginx to point
  # a matching exploit at, and no visitor needs it.
  server_tokens off;

  # ── compression ────────────────────────────────────────────────────────────────────────────────────────────────────
  # A 435 kB JS bundle and a 113 kB stylesheet, down to 145 kB and 17 kB. `text/html` is always included. The map archives
  # are not on this list and must not be: a `.osm.pbf` is compressed already, and gzipping a gigabyte of it would burn CPU
  # for nothing.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types application/javascript application/json text/css text/plain text/xml application/xml image/svg+xml;

  # ── the API hop (inherited by the five proxy locations below) ───────────────────────────────────────────────────────
  # 1.1 + an empty `Connection`, so a chunked upload body streams through instead of being collected to measure it.
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  # The address the API's rate limiter keys on (`client-ip.ts`). `$proxy_add_x_forwarded_for` appends to whatever the
  # outer proxy already sent rather than replacing it. For the API to *trust* it, `TRUST_PROXY` must cover this container's
  # address (`12-deployment.md` §2 — with `TRUST_PROXY=loopback` every client looks like the web container).
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # `$scheme` here is always `http` (this hop is plain), so it would *downgrade* what the TLS proxy said. Passing the
  # outer value through keeps the API's idea of the original scheme correct; an empty value sends no header at all.
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Forwarded-Host $host;

  # Fast failure when the API is not there, generous when it is: a download of a 773 MB `.osm.pbf` over a slow link must
  # not be cut at the default 60 s of silence.
  proxy_connect_timeout 5s;
  proxy_send_timeout 3600s;
  proxy_read_timeout 3600s;

  # ── streaming, without giving up compression ────────────────────────────────────────────────────────────────────────
  # `proxy_request_buffering off` streams an import straight through instead of collecting up to 8 GiB on nginx's disk
  # first — doubling disk use and delaying every progress report by the length of the upload (DOCK-4, `12-deployment.md`
  # §3).
  proxy_request_buffering off;

  # The other direction is **not** `proxy_buffering off`, which is the usual advice and a trap here: with buffering off
  # nginx cannot compress what it forwards, so every JSON answer from the API goes out uncompressed — measured, pass 40 (a
  # 7 kB list came back with no `Content-Encoding`; the same response was gzipped the moment buffering came back on). What
  # made buffering dangerous is its *temp file*: a 773 MB `.osm.pbf` spooled to `/tmp/proxy_temp` at full speed whether or
  # not the client was reading. `proxy_max_temp_file_size 0` removes exactly that — responses are held in memory only for
  # as long as the buffers take (32 kB by default), then passed through to the client with backpressure — so a download
  # streams, memory stays flat, nothing is written to disk, and compression still works.
  proxy_buffering on;
  proxy_max_temp_file_size 0;

  # ── the CSP's one conditional directive ────────────────────────────────────────────────────────────────────────────
  # `14-security.md` §6 ends the policy with `upgrade-insecure-requests`, which rewrites every http subresource request to
  # https. Correct behind the TLS proxy; fatal on the documented first run (`docker compose up` → `http://localhost:8080`),
  # where the assets *are* http and would be upgraded to a port with no TLS: a blank page and a console full of
  # `ERR_SSL_PROTOCOL_ERROR`. So the directive is added only when the outer proxy said the browser's scheme is https —
  # which it does in production (`12-deployment.md` §3) and does not on localhost.
  map $http_x_forwarded_proto $mm_csp_upgrade {
    default "";
    https "; upgrade-insecure-requests";
  }

  server {
    # 8080, not 80: an unprivileged process cannot bind a port below 1024. Compose publishes the host's 8080 onto this
    # one, and the deployment guide already says `http://localhost:8080` (`12-deployment.md` §2).
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The import ceiling, plus headroom: `MAX_UPLOAD_BYTES` defaults to 8 GiB (`09-development.md` §5), and the API's own
    # 413 is the authoritative refusal — reaching nginx's `413` first would answer an HTML page where the SPA expects the
    # error envelope. Large enough that the API is always the one that says no.
    client_max_body_size 9g;

    # ── APIs first ────────────────────────────────────────────────────────────────────────────────────────────────────
    # The route law (`10-laws.md`, L1) says the API serves exactly these five paths and the SPA serves everything else, and
    # these five `location`s must be matched before the page rules below: a `/_auth/api/login` request that fell through
    # to the SPA fallback would be answered with `index.html` and a `200`, which looks like a broken login.
    #
    # `^~` for the three namespaces: it stops a later regex location from taking one of them back, and it is the reason
    # the prefix list can be read as the whole API surface. `=` for the two probes: they are whole paths, not prefixes.
    location ^~ /_auth/api/ {
      proxy_pass http://api:3000;
    }

    location ^~ /_admin/api/ {
      proxy_pass http://api:3000;
    }

    location ^~ /_public/api/ {
      proxy_pass http://api:3000;
    }

    location = /healthz {
      # A probe answers every 10 seconds for ever; it has no business in the request log.
      access_log off;
      proxy_pass http://api:3000;
    }

    location = /readyz {
      access_log off;
      proxy_pass http://api:3000;
    }

    # ── pages ─────────────────────────────────────────────────────────────────────────────────────────────────────────
    # `/` is not a page: the SPA lives under `/_site/`, and a redirect keeps one canonical address (L1).
    location = / {
      return 302 /_site/;
    }

    # `/_site` without the slash would otherwise reach the assets rule below and `404`. A redirect, not a fallback: serving
    # `index.html` here would render the SPA at a path its router does not know.
    location = /_site {
      return 301 /_site/;
    }

    # The one page outside `/_site/` (`AUTH-2`, D-19). No file lives at this path, so `try_files` always reaches its last
    # argument — and that argument is a **URI**, which nginx resolves again: the request lands on the `/index.html`
    # location below and picks up the shell's headers and cache policy. Written as `/index.html =404` it would instead serve
    # the file *inside this location*, with none of either — measured, pass 40: the login page came back with no
    # `Content-Security-Policy` and no `Cache-Control`.
    location = /_auth/login {
      try_files $uri /index.html;
    }

    # Deep links: `/_site/admin/cache/finland` is a route in the SPA, not a file. The last argument is a URI, so nginx
    # re-runs location matching for it — which is how the shell gets its headers and its cache policy.
    location ^~ /_site/ {
      try_files $uri /index.html;
    }

    # The shell. `expires -1` is "revalidate every time" (`Cache-Control: no-cache`), which is the only safe policy for the
    # one file whose name does not change between deploys.
    location = /index.html {
      expires -1;
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; manifest-src 'self'$mm_csp_upgrade";
      add_header X-Content-Type-Options "nosniff";
      add_header X-Frame-Options "DENY";
      add_header Referrer-Policy "strict-origin-when-cross-origin";
      add_header Permissions-Policy "geolocation=(), camera=(), microphone=()";
      add_header Cross-Origin-Opener-Policy "same-origin";
    }

    # Everything Vite emitted is content-addressed (`index-WzY0repx.js`), so a year is honest: a new build is a new name.
    # `nosniff` is the one header a script or a stylesheet needs (`X-Content-Type-Options`); CSP on a `.js` response would
    # do nothing.
    #
    # A prefix, not a regular expression: the bundle's files are all under `/assets/`, and `^~` keeps the rule explicit.
    location ^~ /assets/ {
      expires 1y;
      add_header X-Content-Type-Options "nosniff";
      access_log off;
    }

    # Anything else is a file or a `404`. The SPA fallback is scoped to `/_site/`, so a typo in an asset name is a `404`
    # rather than an `index.html` that then fails to parse as JavaScript.
    location / {
      try_files $uri =404;
    }
  }
}
